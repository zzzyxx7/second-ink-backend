services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: second_ink
      MYSQL_USER: secondink
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secondink_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secondink_root_dev}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql-data:
